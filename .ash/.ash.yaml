# ASH (Automated Security Helper) configuration
# https://awslabs.github.io/automated-security-helper/
#
# Suppressions for reviewed-and-accepted Checkov findings. These are marked as
# suppressed in reports but still scanned, so they remain visible.
# Note: CKV_AWS_111 (IAM write access without constraints) is intentionally
# NOT suppressed and must be reviewed on its own merits.
global_settings:
  suppressions:
    # The access-logs bucket cannot itself have access logging enabled without
    # creating a recursive logging target; it is the logging destination bucket.
    - rule_id: 'CKV_AWS_18'
      path: '2-observability-assessment-codebuild.yaml'
      reason: 'S3 access-log destination bucket; enabling access logging on the log bucket itself would create recursive/self-referential logging.'

    # The Lambda log group is auto-created for a helper Lambda and holds no
    # sensitive data; SSE-KMS encryption is not required for this use case.
    - rule_id: 'CKV_AWS_158'
      path: '2-observability-assessment-codebuild.yaml'
      reason: 'Log group for a short-lived build-trigger Lambda contains no sensitive data; default CloudWatch Logs encryption is sufficient.'

    # This is a short-lived custom-resource Lambda that only calls StartBuild via
    # the AWS API; it needs no VPC resources and adding a VPC adds no security value.
    - rule_id: 'CKV_AWS_117'
      path: '2-observability-assessment-codebuild.yaml'
      reason: 'Custom-resource Lambda only invokes the CodeBuild StartBuild API; it accesses no VPC resources, so VPC configuration is unnecessary.'

    # A one-shot custom-resource Lambda triggered once on stack creation does not
    # benefit from a Dead Letter Queue.
    - rule_id: 'CKV_AWS_116'
      path: '2-observability-assessment-codebuild.yaml'
      reason: 'One-shot custom-resource Lambda invoked once at stack creation; a DLQ provides no operational value for this synchronous trigger.'

    # The AWS CLI runner tokenizes commands with shlex.split() and executes an
    # argument list without a shell; interpolated AWS values are shlex.quote()d.
    - rule_id: 'python.lang.security.audit.dangerous-subprocess-use-audit'
      path: 'observability_assessment/aws.py'
      reason: 'subprocess.run receives a shlex.split() argument list with shell=False; dynamic values are shlex.quote()d, so no command injection is possible.'

    # Tests run the repository entry point with a fixed argument list
    # ([sys.executable, <repo file>, "--help"]) and no shell.
    - rule_id: 'python.lang.security.audit.dangerous-subprocess-use-audit'
      path: 'tests/test_characterization.py'
      reason: 'Test invokes the repo CLI with a static argument list and shell=False, and constructs CompletedProcess mocks; no untrusted input reaches subprocess.'

    - rule_id: 'python.lang.security.audit.dangerous-subprocess-use-audit'
      path: 'tests/test_synthetic_run.py'
      reason: 'Test invokes the repo CLI with a static argument list and shell=False; no untrusted input reaches subprocess.'

    # subprocess.CompletedProcess is a plain result object used as a mock
    # return value; constructing it executes nothing.
    - rule_id: 'python.lang.security.audit.dangerous-subprocess-use-audit'
      path: 'tests/test_aws_runner.py'
      reason: 'Only constructs subprocess.CompletedProcess mock return values; no process is executed.'

    # The report UI JavaScript bundle is a committed, minified build artifact of
    # the Cloudscape React app. The "Secret Keyword" match is a substring in
    # compiled vendor code (e.g. React DOM), not a real credential.
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'observability_assessment/reporting/assets/report-ui.js'
      reason: 'False positive in a committed minified build artifact; the match is a keyword substring in bundled vendor JavaScript, not an actual secret. No credential is present in the compiled UI assets.'
