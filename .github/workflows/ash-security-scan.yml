name: ASH Security Scan

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.py
            **/*.yaml
            **/*.yml
            **/*.json
            **/*.ts
            **/*.tsx
            **/*.sh
            **/requirements*.txt
            **/Dockerfile*
            .ash/.ash.yaml
            .github/workflows/ash-security-scan.yml

      - name: Detect ASH configuration changes
        id: config-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: .ash/.ash.yaml

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ASH
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pip install git+https://github.com/awslabs/automated-security-helper.git@v3.2.6

      - name: Prepare scan directory and configuration
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          mkdir -p /tmp/ash-scan/.ash
          cp .ash/.ash.yaml /tmp/ash-scan/.ash/.ash.yaml
          echo "Changed files for security scan:"
          echo "$ALL_CHANGED_FILES" | tr ' ' '\n'

      - name: Copy changed files to temp directory
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in $ALL_CHANGED_FILES; do
            if [ -f "$file" ]; then
              mkdir -p "/tmp/ash-scan/$(dirname "$file")"
              cp "$file" "/tmp/ash-scan/$file"
              echo "Copied for scan: $file"
            fi
          done

      - name: Run ASH scan
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CONFIG_CHANGED: ${{ steps.config-changed.outputs.any_changed }}
        run: |
          # A suppression change must be checked against the full repository.
          if [ "$CONFIG_CHANGED" != "true" ]; then
            cd /tmp/ash-scan
          fi
          ash --mode container 2>&1 | tee /tmp/ash-output.log

      - name: Display scan results
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f "/tmp/ash-output.log" ]; then
            echo "## ASH Security Scan Results"
            cat /tmp/ash-output.log
          fi

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "No scannable files changed - skipping security scan"
