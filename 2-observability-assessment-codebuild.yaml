#
# Security controls implemented in this template:
#   - S3 bucket: SSE-S3 encryption, public access blocked, SSL-only policy, versioning (Priority: HIGH)
#   - AWS CodeBuild role: scoped to S3 PutObject/GetObject, CloudWatch Logs,
#     Organizations account discovery, and sts:AssumeRole (Priority: MEDIUM)
#   - Build timeout: 60 minutes maximum (Priority: MEDIUM)
AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Deploys a CodeBuild project that runs the AWS Observability Assessment,
  two Amazon S3 buckets (a reports bucket and its access-log destination
  bucket), and an AWS Lambda function to trigger the first build. In
  single-account mode (CreateAssessmentRole=yes) it also creates the
  read-only assessment role inline.

Parameters:
  AssessmentRegion:
    Description: AWS region to assess.
    Type: String
    Default: us-west-2
  CreateAssessmentRole:
    Description: >-
      Set to 'yes' for single-account mode (creates the assessment role in this account).
      Set to 'no' if you already deployed 1-observability-assessment-role.yaml separately.
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
  AssessmentAccounts:
    Description: >-
      Comma-separated account IDs for multi-account assessment.
      Leave empty for single-account mode.
    Type: String
    Default: ""
  AssessmentOUs:
    Description: >-
      Comma-separated OU IDs to scope multi-account assessment.
      Leave empty for single-account or explicit account list mode.
    Type: String
    Default: ""
  AssessmentRepoUrl:
    Description: Public Git repository URL to clone the assessment source from.
    Type: String
    Default: https://github.com/aws-samples/sample-aws-observability-assessment.git
    MinLength: 1
  AssessmentGitRef:
    Description: Public repository branch or tag to check out for each build.
    Type: String
    Default: main
    MinLength: 1
  ExpectedAssessmentCommitSha:
    Description: >-
      Optional full Git commit SHA. Fail the build if the checked-out commit
      differs from this value.
    Type: String
    Default: ""
    MaxLength: 40
    AllowedPattern: '^$|^[0-9a-fA-F]{40}$'

Conditions:
  CreateAssessmentRole: !Equals [!Ref CreateAssessmentRole, "yes"]

Resources:
  # --- S3 Access Logging Bucket ---
  ReportBucketAccessLogs:
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "S3 access-log destination bucket; enabling access logging on the log bucket itself would create recursive/self-referential logging."
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  ReportBucketAccessLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportBucketAccessLogs
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${ReportBucketAccessLogs.Arn}/report-access-logs/*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::*"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # --- S3 Bucket for reports ---
  ReportBucket:
    DependsOn: ReportBucketAccessLogsPolicy
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref ReportBucketAccessLogs
        LogFilePrefix: report-access-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSLRequestsOnly
            Principal: "*"
            Action: "s3:*"
            Effect: Deny
            Resource:
              - !Sub "${ReportBucket.Arn}"
              - !Sub "${ReportBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # --- Assessment role (single-account mode) ---
  ObservabilityAssessmentRole:
    Condition: CreateAssessmentRole
    Type: "AWS::IAM::Role"
    # Some cfn-lint IAM action catalogs do not recognize the CloudWatch Omni list actions.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3037
    Properties:
      RoleName: ObservabilityAssessmentRole
      Path: "/service-role/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "sts:AssumeRole"
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/ObservabilityAssessmentCodeBuildRole"
      Policies:
        - PolicyName: ObservabilityAssessmentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:DescribeQueries
                  - logs:FilterLogEvents
                  - logs:DescribeQueryDefinitions
                  - logs:DescribeMetricFilters
                  - logs:DescribeSubscriptionFilters
                  - logs:DescribeExportTasks
                  - logs:DescribeIndexPolicies
                  - logs:DescribeDestinations
                  - logs:DescribeFieldIndexes
                  - logs:ListLogAnomalyDetectors
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAnomalyDetectors
                  - cloudwatch:ListDashboards
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListMetricStreams
                  - cloudwatch:ListDomains
                  - cloudwatch:ListSpaces
                  - cloudwatch:ListIntegrations
                  - ec2:DescribeInstances
                  - lambda:ListFunctions
                  - lambda:GetFunctionConfiguration
                  - xray:GetServiceGraph
                  - xray:GetSamplingRules
                  - xray:GetGroups
                  - xray:GetInsightSummaries
                  - xray:GetTraceSummaries
                  - xray:GetTraceSegmentDestination
                  - ecs:ListClusters
                  - ecs:DescribeClusters
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:ListAddons
                  - eks:DescribeAddon
                  - synthetics:DescribeCanaries
                  - rum:ListAppMonitors
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - application-signals:ListServices
                  - application-signals:ListServiceLevelObjectives
                  - organizations:DescribeOrganization
                  - organizations:DescribeAccount
                  - tag:GetResources
                  - oam:ListLinks
                  - oam:ListSinks
                  - observabilityadmin:ListCentralizationRulesForOrganization
                  - firehose:ListDeliveryStreams
                  - firehose:DescribeDeliveryStream
                  - kinesis:ListStreams
                  - aidevops:ListAgentSpaces
                Resource: "*"
              # Sole write action in this policy. The EC2 CloudWatch-agent check
              # runs the AWS-owned AWS-RunShellScript document on instances, which
              # requires ssm:SendCommand. Scope it to that one document and this
              # account's instances so the write access is constrained (CKV_AWS_111).
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:*::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*"

  # --- CodeBuild IAM Role ---
  ObservabilityAssessmentCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ObservabilityAssessmentCodeBuildRole
      Path: "/service-role/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/ObservabilityAssessmentCodeBuild"
      Policies:
        - PolicyName: LogGroup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${ReportBucket.Arn}/*"
        - PolicyName: AssumeAssessmentRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/service-role/ObservabilityAssessmentRole"
        - PolicyName: OrganizationsReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:ListAccountsForParent
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:DescribeOrganization
                  - organizations:DescribeAccount
                Resource: "*"

  # --- CodeBuild Project ---
  ObservabilityAssessmentCodeBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ObservabilityAssessmentCodeBuild
      Description: Run AWS Observability Maturity Assessment
      ServiceRole: !GetAtt ObservabilityAssessmentCodeBuildRole.Arn
      TimeoutInMinutes: 60
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: "aws/codebuild/amazonlinux-x86_64-standard:6.0"
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: BUCKET_REPORT
            Value: !Ref ReportBucket
            Type: PLAINTEXT
          - Name: ASSESSMENT_REGION
            Value: !Ref AssessmentRegion
            Type: PLAINTEXT
          - Name: ASSESSMENT_ACCOUNTS
            Value: !Ref AssessmentAccounts
            Type: PLAINTEXT
          - Name: ASSESSMENT_OUS
            Value: !Ref AssessmentOUs
            Type: PLAINTEXT
          - Name: ASSESSMENT_REPO_URL
            Value: !Ref AssessmentRepoUrl
            Type: PLAINTEXT
          - Name: ASSESSMENT_GIT_REF
            Value: !Ref AssessmentGitRef
            Type: PLAINTEXT
          - Name: EXPECTED_ASSESSMENT_COMMIT_SHA
            Value: !Ref ExpectedAssessmentCommitSha
            Type: PLAINTEXT
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                # Each multi-line command enables strict shell flags so failures
                # stop the build before the assessment or upload continues.
                - |
                  set -euo pipefail
                  # The AWS DevOps Agent check calls `aws devops-agent` (AWS CLI v2
                  # >= 2.34.21) and the CloudWatch Omni checks call
                  # `aws cloudwatchomni` (>= 2.37.0). Update to the latest v2 so
                  # both are present regardless of image age.
                  echo "AWS CLI version before update:"; aws --version
                  curl -sSfL --retry 3 --max-time 120 "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                  unzip -q awscliv2.zip
                  ./aws/install --update
                  hash -r
                  echo "AWS CLI version after update:"; aws --version
            build:
              commands:
                - |
                  set -euo pipefail
                  REPO_URL="$ASSESSMENT_REPO_URL"
                  echo "Cloning ${REPO_URL} at ref ${ASSESSMENT_GIT_REF}..."
                  if ! git clone --depth 1 --branch "$ASSESSMENT_GIT_REF" "$REPO_URL" assessment-src; then
                    echo "ERROR: could not clone assessment source from ${REPO_URL} at ref ${ASSESSMENT_GIT_REF}. Check the repository URL, ref, and outbound HTTPS access." >&2
                    exit 1
                  fi
                  ACTUAL_SHA=$(git -C assessment-src rev-parse --verify HEAD)
                  echo "Assessment source commit: ${ACTUAL_SHA}"
                  if [ -n "$EXPECTED_ASSESSMENT_COMMIT_SHA" ] && [ "$ACTUAL_SHA" != "$(printf '%s' "$EXPECTED_ASSESSMENT_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')" ]; then
                    echo "ERROR: assessment source commit ${ACTUAL_SHA} does not match expected SHA ${EXPECTED_ASSESSMENT_COMMIT_SHA}." >&2
                    exit 1
                  fi
                  if [ ! -s assessment-src/observability_assessment_comprehensive.py ]; then
                    echo "ERROR: assessment script is missing or empty in the cloned repository." >&2
                    exit 1
                  fi
                  if [ ! -s assessment-src/requirements.txt ]; then
                    echo "ERROR: assessment dependencies are missing from the cloned repository." >&2
                    exit 1
                  fi
                  python3 -m pip install --disable-pip-version-check -r assessment-src/requirements.txt
                - |
                  set -euo pipefail
                  # Resolve caller identity once and validate before building an ARN,
                  # so an empty account/partition can't produce a malformed --role-arn.
                  CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
                  ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                  PARTITION=$(echo "$CALLER_ARN" | cut -d: -f2)
                  if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" = "None" ]; then
                    echo "ERROR: could not resolve AWS account ID from sts:GetCallerIdentity." >&2
                    exit 1
                  fi
                  if [ -z "$PARTITION" ]; then
                    echo "ERROR: could not resolve AWS partition from caller ARN '${CALLER_ARN}'." >&2
                    exit 1
                  fi
                  MULTI_ACCOUNT_FLAGS=""
                  if [ -n "${ASSESSMENT_ACCOUNTS:-}" ]; then
                    MULTI_ACCOUNT_FLAGS="--accounts $ASSESSMENT_ACCOUNTS"
                  elif [ -n "${ASSESSMENT_OUS:-}" ]; then
                    MULTI_ACCOUNT_FLAGS="--ou $ASSESSMENT_OUS"
                  fi
                  if [ -n "$MULTI_ACCOUNT_FLAGS" ]; then
                    echo "Running multi-account assessment: ${MULTI_ACCOUNT_FLAGS}"
                    python3 assessment-src/observability_assessment_comprehensive.py --region "$ASSESSMENT_REGION" $MULTI_ACCOUNT_FLAGS
                  else
                    ROLE_ARN="arn:${PARTITION}:iam::${ACCOUNT_ID}:role/service-role/ObservabilityAssessmentRole"
                    echo "Assuming assessment role: ${ROLE_ARN}"
                    python3 assessment-src/observability_assessment_comprehensive.py --region "$ASSESSMENT_REGION" --role-arn "$ROLE_ARN"
                  fi
                - |
                  set -euo pipefail
                  if [ ! -d assessment-result ]; then
                    echo "ERROR: assessment produced no 'assessment-result' directory; nothing to upload." >&2
                    exit 1
                  fi
                  aws s3 cp assessment-result/ "s3://$BUCKET_REPORT/" --recursive --exclude "*" --include "*.html" --include "*.csv"
                  # Also publish a single zip bundle of all reports for convenience.
                  # Timestamp the bundle name so repeated scans (multi-region or
                  # re-runs) don't overwrite each other in the report bucket.
                  REPORT_TS=$(date -u +%Y%m%d_%H%M%S)
                  ( cd assessment-result && zip -r "../assessment-report_${REPORT_TS}.zip" *.html *.csv )
                  aws s3 cp "assessment-report_${REPORT_TS}.zip" "s3://$BUCKET_REPORT/"
                  echo "Assessment complete. Reports uploaded to s3://$BUCKET_REPORT/"

  # --- Lambda to trigger first build ---
  CodeBuildStartBuildLambdaRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub "${AWS::AccountId}"
      Path: /
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: StartBuildInline
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                Resource: !GetAtt ObservabilityAssessmentCodeBuild.Arn

  CodeBuildStartBuildLogGroup:
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CodeBuildStartBuildLambda}"
      RetentionInDays: 7

  CodeBuildStartBuildLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !Sub "${CodeBuildStartBuildLambdaRole.Arn}"
      Timeout: 120
      Runtime: python3.12
      ReservedConcurrentExecutions: 1
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def lambda_handler(event, context):
              physical_id = event.get('PhysicalResourceId', context.log_stream_name)
              if event.get('RequestType') == 'Create':
                  try:
                      props = event.get('ResourceProperties', {})
                      project_name = props.get('ProjectName', '')
                      if not project_name or not isinstance(project_name, str):
                          raise ValueError('Missing or invalid ProjectName')
                      cb = boto3.client('codebuild')
                      response = cb.start_build(projectName=project_name)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'buildID': response['build']['id']}, physicalResourceId=physical_id)
                  except Exception as e:
                      print(e)
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'error': str(e)}, physicalResourceId=physical_id)
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physicalResourceId=physical_id)

  CodeBuildStartBuild:
    Type: Custom::CodeBuildStartBuild
    Properties:
      ServiceToken: !GetAtt CodeBuildStartBuildLambda.Arn
      ProjectName: !Ref ObservabilityAssessmentCodeBuild
      # Ref creates an implicit dependency on the role in single-account mode.
      # Keep this logical ID stable so stack updates send Update, not Create.
      AssessmentRoleReady: !If
        - CreateAssessmentRole
        - !Ref ObservabilityAssessmentRole
        - !Ref AWS::NoValue

Outputs:
  ReportBucketName:
    Description: S3 bucket where assessment reports are stored
    Value: !Ref ReportBucket
  CodeBuildProject:
    Description: CodeBuild project name
    Value: !Ref ObservabilityAssessmentCodeBuild
