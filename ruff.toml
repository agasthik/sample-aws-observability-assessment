# CI installs Ruff without pinning its version. Keep the lint contract explicit
# so a change to Ruff's defaults does not make unrelated legacy findings block
# every pull request that touches a Python file.

target-version = "py312"
line-length = 88
extend-exclude = ["*.md"]

[lint]
# Ruff's historical default rules: pycodestyle errors and Pyflakes.
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "double"
indent-style = "space"
